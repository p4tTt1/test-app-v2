name: ws-watch
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: ws
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python watch_ws.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state_ws.json
          git diff --cached --quiet || (git commit -m "state ws" && git pull --rebase && git push)